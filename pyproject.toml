[project]
name = "csv2duck"
version = "0.1.0"
description = "CLI to validate, transform, and load CSV/JSON data into DuckDB"
readme = "README.md"
authors = [
    { name = "Ryan Kidd", email = "itsryankidd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.1",
    "pydantic>=2.9",
]

[project.scripts]
csv2duck = "csv2duck.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
