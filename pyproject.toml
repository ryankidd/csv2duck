[project]
name = "csv2duck"
version = "0.1.0"
description = "CLI to validate, transform, and load CSV/JSON data into DuckDB"
readme = "README.md"
authors = [
    { name = "Ryan Kidd", email = "itsryankidd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.1",
    "pydantic>=2.9",
    "duckdb>=1.5.5",
]

[project.scripts]
csv2duck = "csv2duck.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic option/argument defaults call typer.Option()/typer.Argument().
"src/csv2duck/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
